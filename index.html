<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CB Studios — FiveM & RedM Documentation</title>
  <meta name="description" content="Official CB Studios documentation for FiveM and RedM resources." />
  <meta name="theme-color" content="#15181d" />
  <link rel="canonical" href="https://docs.pichirincb.com/" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-brand" href="#/home" aria-label="CB Studios documentation home">
        <img src="assets/branding/logo.png" alt="" />
        <span>CB Studios Docs</span>
      </a>

      <nav class="site-nav" aria-label="Primary navigation">
        <a href="#/home">Home</a>
        <a href="#/products">All Resources</a>
        <a class="site-nav__store" href="https://pichirin-cb.tebex.io/" target="_blank" rel="noopener noreferrer">Store</a>
      </nav>
    </div>
  </header>

  <div id="announcement-bar" class="announcement-bar" aria-live="polite"></div>

  <button class="mobile-menu-button" type="button" aria-label="Toggle navigation" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <div id="app">Loading CB Studios documentation…</div>

  <script>
    window.$docsify = {
      name: "CB Studios",
      repo: "",
      homepage: "home.md",
      loadSidebar: true,
      subMaxLevel: 2,
      maxLevel: 4,
      autoHeader: false,
      coverpage: false,
      notFoundPage: true,
      themeColor: "#f5a33a",
      alias: {
        "/_sidebar.md": "/_sidebar.md",
        "/.*/_sidebar.md": "/_sidebar.md"
      },
      search: {
        maxAge: 86400000,
        paths: "auto",
        placeholder: "Search documentation…",
        noData: "No results found.",
        depth: 3
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var sidebar = document.querySelector(".sidebar");
            if (!sidebar) return;

            if (!sidebar.querySelector(".sidebar-brand")) {
              var brand = document.createElement("div");
              brand.className = "sidebar-brand";
              brand.innerHTML =
                '<img src="assets/branding/logo.png" alt="CB Studios">' +
                '<div><strong>CB Studios</strong><span>FiveM & RedM Docs</span></div>';
              sidebar.insertBefore(brand, sidebar.firstChild);
            }
          });
        },
        function (hook) {
          hook.afterEach(function (html, next) {
            next(
              html +
              '<footer class="cb-footer">' +
                '<div class="cb-footer__top">' +
                  '<div class="cb-footer__brand">' +
                    '<img src="assets/branding/logo.png" alt="CB Studios">' +
                    '<div><strong>CB Studios</strong><span>Official FiveM & RedM documentation.</span></div>' +
                  '</div>' +
                  '<div class="cb-footer__links">' +
                    '<a href="#/support">Support</a>' +
                    '<a href="#/faq">FAQ</a>' +
                    '<a href="#/changelog">Changelog</a>' +
                    '<a href="#/legal/index">Legal</a>' +
                    '<a href="https://github.com/Pichirin-CB?tab=repositories" target="_blank" rel="noopener noreferrer">GitHub</a>' +
                    '<a href="https://discord.gg/hsx6AvBg5s" target="_blank" rel="noopener noreferrer">Discord</a>' +
                    '<a href="https://pichirin-cb.tebex.io/" target="_blank" rel="noopener noreferrer">Store</a>' +
                  '</div>' +
                '</div>' +
                '<div class="cb-footer__legal">© 2025–2026 CB Studios. All Rights Reserved. Not affiliated with Rockstar Games.</div>' +
              '</footer>'
            );
          });
        }
      ]
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>

  <script src="products-config.js"></script>
  <script src="banner-config.js"></script>

  <script>
    (function () {
      var menuButton = document.querySelector(".mobile-menu-button");

      function syncMenuState() {
        var open = document.body.classList.contains("sidebar-open");
        if (menuButton) menuButton.setAttribute("aria-expanded", String(open));
      }

      if (menuButton) {
        menuButton.addEventListener("click", function () {
          document.body.classList.toggle("sidebar-open");
          syncMenuState();
        });
      }

      document.addEventListener("click", function (event) {
        if (window.innerWidth > 900) return;
        if (!document.body.classList.contains("sidebar-open")) return;
        var sidebar = event.target.closest(".sidebar");
        var button = event.target.closest(".mobile-menu-button");
        if (!sidebar && !button) {
          document.body.classList.remove("sidebar-open");
          syncMenuState();
        }
      });

      window.addEventListener("hashchange", function () {
        if (window.innerWidth <= 900) {
          document.body.classList.remove("sidebar-open");
          syncMenuState();
        }
      });

      function productMatches(product, filter) {
        if (!filter || filter === "all") return true;
        var category = (product.category || "").toLowerCase();
        var frameworks = (product.frameworks || []).map(function (item) { return item.toLowerCase(); });

        if (filter === "paid") return product.type === "paid";
        if (filter === "free") return product.type === "free";
        if (filter === "scripts") return category.indexOf("script") !== -1 || category.indexOf("resource") !== -1;
        if (filter === "vehicles") return category.indexOf("vehicle") !== -1;
        if (filter === "audio") return category.indexOf("audio") !== -1;
        if (filter === "mlo") return category.indexOf("mlo") !== -1 || category.indexOf("mapping") !== -1;
        return frameworks.indexOf(filter.toLowerCase()) !== -1;
      }

      function productCard(product) {
        var category = product.category || "Resource";
        var type = product.type || "resource";
        var frameworks = (product.frameworks || []).slice(0, 4).map(function (fw) {
          return '<span class="product-badge">' + fw + '</span>';
        }).join("");

        return '' +
          '<article class="product-card">' +
            '<div class="product-card__eyebrow">' + category + '</div>' +
            '<h3>' + product.name + '</h3>' +
            '<p>' + product.description + '</p>' +
            '<div class="product-badges">' +
              '<span class="product-badge product-badge--accent">' + (product.status || "Available") + '</span>' +
              '<span class="product-badge">' + type + '</span>' +
              frameworks +
            '</div>' +
            '<div class="product-actions">' +
              '<a class="docs-button docs-button--primary" href="#' + product.docPath + '">Open docs</a>' +
              (product.storeUrl
                ? '<a class="docs-button" href="' + product.storeUrl + '" target="_blank" rel="noopener noreferrer">Store</a>'
                : '<a class="docs-button" href="#/support">Support</a>') +
            '</div>' +
          '</article>';
      }

      function renderProducts() {
        var products = window.CB_PRODUCTS || [];

        var featured = document.getElementById("featured-products");
        if (featured && !featured.dataset.rendered) {
          featured.innerHTML = products.filter(function (item) { return item.featured; }).map(productCard).join("");
          featured.dataset.rendered = "true";
        }

        var productsApp = document.getElementById("products-app");
        if (!productsApp || productsApp.dataset.rendered) return;

        var filters = ["all","paid","free","scripts","vehicles","audio","mlo","FiveM","RedM","QBCore","ESX","VORP","Standalone"];

        productsApp.innerHTML =
          '<div class="catalog-toolbar">' +
            '<input class="catalog-search" type="search" placeholder="Search resources…" aria-label="Search resources">' +
            '<span class="catalog-count"></span>' +
          '</div>' +
          '<div class="filter-bar">' +
            filters.map(function (filter) {
              return '<button type="button" class="filter-button" data-filter="' + filter.toLowerCase() + '">' + filter + '</button>';
            }).join("") +
          '</div>' +
          '<div class="product-grid" id="products-grid"></div>';

        productsApp.dataset.rendered = "true";

        var grid = document.getElementById("products-grid");
        var search = productsApp.querySelector(".catalog-search");
        var count = productsApp.querySelector(".catalog-count");
        var activeFilter = "all";

        function applyFilter(filter) {
          activeFilter = (filter || "all").toLowerCase();
          var query = (search.value || "").trim().toLowerCase();

          var visible = products.filter(function (product) {
            var searchable = [product.name, product.resource, product.category, product.description]
              .concat(product.frameworks || []).join(" ").toLowerCase();

            return productMatches(product, activeFilter) && (!query || searchable.indexOf(query) !== -1);
          });

          grid.innerHTML = visible.length
            ? visible.map(productCard).join("")
            : '<div class="catalog-empty">No resources found.</div>';

          count.textContent = visible.length + (visible.length === 1 ? " resource" : " resources");

          productsApp.querySelectorAll(".filter-button").forEach(function (button) {
            button.classList.toggle("active", button.dataset.filter === activeFilter);
          });
        }

        productsApp.addEventListener("click", function (event) {
          var button = event.target.closest(".filter-button");
          if (button) applyFilter(button.dataset.filter);
        });

        search.addEventListener("input", function () { applyFilter(activeFilter); });

        var hashFilter = (location.hash.match(/[?&]filter=([^&]+)/) || [])[1];
        applyFilter(hashFilter || "all");
      }

      function updateMeta() {
        var route = (location.hash || "#/home").replace(/^#\/?/, "").split(/[?&]/)[0].replace(/\.md$/, "");
        var titleMap = {
          home: "Documentation",
          products: "All Resources",
          "getting-started": "Getting Started",
          support: "Support",
          faq: "FAQ",
          problems: "Troubleshooting",
          changelog: "Changelog"
        };
        document.title = (titleMap[route] || "Documentation") + " | CB Studios";
      }

      function renderBanner() {
        var cfg = window.CB_BANNER_CONFIG;
        var bar = document.getElementById("announcement-bar");
        if (!cfg || !cfg.enabled || !bar) return;

        var dismissed = cfg.dismiss && cfg.dismiss.enabled && cfg.dismiss.storageKey &&
          localStorage.getItem(cfg.dismiss.storageKey) === "dismissed";

        if (dismissed) return;

        bar.innerHTML =
          '<div class="announcement-bar__inner">' +
            '<div class="announcement-bar__copy">' +
              (cfg.icon ? '<span class="announcement-bar__icon">' + cfg.icon + '</span>' : '') +
              '<div>' +
                (cfg.title ? '<strong>' + cfg.title + '</strong>' : '') +
                (cfg.subtitle ? '<span>' + cfg.subtitle + '</span>' : '') +
              '</div>' +
            '</div>' +
            (cfg.cta && cfg.cta.enabled && cfg.cta.label && cfg.cta.url
              ? '<a href="' + cfg.cta.url + '" target="' + (cfg.cta.target || "_blank") + '" rel="noopener noreferrer">' + cfg.cta.label + '</a>'
              : '') +
            (cfg.dismiss && cfg.dismiss.enabled ? '<button type="button" aria-label="Dismiss">×</button>' : '') +
          '</div>';

        bar.classList.add("is-visible");

        var dismiss = bar.querySelector("button");
        if (dismiss) {
          dismiss.addEventListener("click", function () {
            bar.classList.remove("is-visible");
            if (cfg.dismiss.storageKey) localStorage.setItem(cfg.dismiss.storageKey, "dismissed");
          });
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        renderBanner();
        updateMeta();
        setTimeout(renderProducts, 350);
      });

      window.addEventListener("hashchange", function () {
        updateMeta();
        setTimeout(renderProducts, 120);
      });
    })();
  </script>
</body>
</html>
