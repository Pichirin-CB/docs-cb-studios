<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CB Studios — FiveM & RedM Documentation</title>
  <meta name="description" content="Official CB Studios documentation for FiveM and RedM resources." />
  <meta name="theme-color" content="#15171c" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      var saved = localStorage.getItem('cb-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to documentation</a>
  <div id="announcement-bar" class="announcement-bar"></div>
  <div id="app">Loading CB Studios documentation…</div>
  <button id="scroll-toggle-btn" class="scroll-toggle-btn" type="button" aria-label="Scroll to bottom">↓</button>

  <script>
    window.$docsify = {
      name: 'CB Studios',
      loadSidebar: true,
      subMaxLevel: 3,
      maxLevel: 4,
      autoHeader: false,
      coverpage: false,
      notFoundPage: true,
      homepage: 'home.md',
      themeColor: '#f2a640',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation…',
        noData: 'No results found.',
        depth: 3
      },
      alias: {
        '/_sidebar.md': '/_sidebar.md',
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var sidebar = document.querySelector('.sidebar');
            var nav = document.querySelector('.sidebar-nav');
            if (!sidebar || !nav || document.querySelector('.brand-header')) return;

            var header = document.createElement('div');
            header.className = 'brand-header';
            header.innerHTML =
              '<a class="brand-lockup" href="#/home" aria-label="CB Studios home">' +
                '<img src="assets/branding/logo.png" alt="CB Studios Logo" />' +
                '<span><strong>CB Studios</strong><small>FiveM & RedM Docs</small></span>' +
              '</a>' +
              '<button class="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">◐</button>';
            sidebar.insertBefore(header, sidebar.firstChild);

            var label = document.createElement('div');
            label.className = 'sidebar-menu-label';
            label.textContent = 'Documentation';
            sidebar.insertBefore(label, nav);
          });
        },
        function (hook) {
          hook.afterEach(function (html, next) {
            next(
              '<main id="main-content">' + html + '</main>' +
              '<div class="page-nav-actions">' +
                '<button class="docs-button" type="button" data-page-back>Back</button>' +
                '<a class="docs-button" href="#/home">Home</a>' +
                '<a class="docs-button docs-button--ghost" href="#/products">All Products</a>' +
              '</div>' +
              '<footer class="cb-footer">' +
                '<div class="cb-footer__brand"><img src="assets/branding/logo.png" alt="CB Studios"><div><strong>CB Studios</strong><span>Official FiveM & RedM documentation.</span></div></div>' +
                '<div class="cb-footer__links">' +
                  '<a href="#/support">Support</a>' +
                  '<a href="#/faq">FAQ</a>' +
                  '<a href="#/changelog">Changelog</a>' +
                  '<a href="#/legal/index">Legal</a>' +
                  '<a href="https://github.com/Pichirin-CB?tab=repositories" target="_blank" rel="noopener noreferrer">GitHub</a>' +
                  '<a href="https://discord.gg/hsx6AvBg5s" target="_blank" rel="noopener noreferrer">Discord</a>' +
                  '<a href="https://pichirin-cb.tebex.io/" target="_blank" rel="noopener noreferrer">Store</a>' +
                '</div>' +
                '<p>© 2025–2026 CB Studios. All Rights Reserved. Not affiliated with Rockstar Games.</p>' +
              '</footer>'
            );
          });
        }
      ]
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="products-config.js"></script>
  <script src="banner-config.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('cb-theme', theme);
      }

      document.addEventListener('click', function (event) {
        var back = event.target.closest('[data-page-back]');
        if (back) {
          if (history.length > 1) history.back(); else location.hash = '#/home';
          return;
        }
        var toggle = event.target.closest('.theme-toggle');
        if (toggle) {
          var current = document.documentElement.getAttribute('data-theme') || 'dark';
          setTheme(current === 'dark' ? 'light' : 'dark');
        }
      });

      var btn = document.getElementById('scroll-toggle-btn');
      function syncScrollButton() {
        if (!btn) return;
        var atBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 8;
        btn.textContent = atBottom ? '↑' : '↓';
        btn.dataset.dir = atBottom ? 'up' : 'down';
        btn.style.opacity = window.scrollY > 320 ? '1' : '0';
      }
      if (btn) {
        btn.addEventListener('click', function () {
          window.scrollTo({ top: btn.dataset.dir === 'up' ? 0 : document.body.scrollHeight, behavior: 'smooth' });
        });
        window.addEventListener('scroll', syncScrollButton);
        syncScrollButton();
      }

      function productMatches(product, filter) {
        if (!filter || filter === 'all') return true;
        var category = (product.category || '').toLowerCase();
        var frameworks = (product.frameworks || []).map(function (x) { return x.toLowerCase(); });
        if (filter === 'paid') return product.type === 'paid';
        if (filter === 'free') return product.type === 'free';
        if (filter === 'scripts') return category.indexOf('script') !== -1 || category.indexOf('resource') !== -1;
        if (filter === 'vehicles') return category.indexOf('vehicle') !== -1;
        if (filter === 'audio') return category.indexOf('audio') !== -1;
        if (filter === 'mlo') return category.indexOf('mlo') !== -1 || category.indexOf('mapping') !== -1;
        return frameworks.indexOf(filter.toLowerCase()) !== -1;
      }

      function productCard(product) {
        var category = product.category || 'Resource';
        var platform = (product.frameworks || []).indexOf('RedM') !== -1 ? 'REDM' : 'FIVEM';
        var typeBadge = product.type ? '<span class="product-badge product-badge--' + product.type + '">' + product.type + '</span>' : '';
        var frameworkBadges = (product.frameworks || []).slice(0, 4).map(function (fw) {
          return '<span class="product-badge">' + fw + '</span>';
        }).join('');
        var secondaryAction = product.storeUrl
          ? '<a class="docs-button docs-button--ghost" href="' + product.storeUrl + '" target="_blank" rel="noopener noreferrer">Store</a>'
          : '<a class="docs-button docs-button--ghost" href="#/support">Support</a>';
        return '<article class="product-card">' +
          '<div class="product-card__top"><span class="product-card__platform">' + platform + '</span><span class="product-card__category">' + category + '</span></div>' +
          '<h3>' + product.name + '</h3>' +
          '<div class="product-badges"><span class="product-badge product-badge--status">' + product.status + '</span>' + typeBadge + frameworkBadges + '</div>' +
          '<p>' + product.description + '</p>' +
          '<div class="product-actions"><a class="docs-button docs-button--primary" href="#' + product.docPath + '">Open guide</a>' + secondaryAction + '</div>' +
        '</article>';
      }

      function renderProducts() {
        var products = window.CB_PRODUCTS || [];
        var featured = document.getElementById('featured-products');
        if (featured && !featured.dataset.rendered) {
          featured.innerHTML = products.filter(function (item) { return item.featured; }).map(productCard).join('');
          featured.dataset.rendered = 'true';
        }
        var app = document.getElementById('products-app');
        if (!app || app.dataset.rendered) return;
        var filters = ['all','paid','free','scripts','vehicles','audio','mlo','FiveM','RedM','QBCore','ESX','VORP','Standalone'];
        app.innerHTML = '<div class="catalog-toolbar"><input class="catalog-search" type="search" placeholder="Search resources…" autocomplete="off"><span class="catalog-count"></span></div>' +
          '<div class="filter-bar">' + filters.map(function (f) { return '<button class="filter-button" type="button" data-filter="' + f.toLowerCase() + '">' + f + '</button>'; }).join('') + '</div>' +
          '<div class="product-grid" id="products-grid"></div>';
        app.dataset.rendered = 'true';
        var grid = app.querySelector('#products-grid');
        var search = app.querySelector('.catalog-search');
        var count = app.querySelector('.catalog-count');
        var active = 'all';
        function apply(filter) {
          active = (filter || 'all').toLowerCase();
          var q = (search.value || '').trim().toLowerCase();
          var visible = products.filter(function (p) {
            var haystack = [p.name,p.resource,p.category,p.description].concat(p.frameworks || []).join(' ').toLowerCase();
            return productMatches(p, active) && (!q || haystack.indexOf(q) !== -1);
          });
          grid.innerHTML = visible.length ? visible.map(productCard).join('') : '<div class="catalog-empty">No resources found.</div>';
          count.textContent = visible.length + (visible.length === 1 ? ' resource' : ' resources');
          app.querySelectorAll('.filter-button').forEach(function (b) { b.classList.toggle('active', b.dataset.filter === active); });
        }
        app.addEventListener('click', function (e) { var b = e.target.closest('.filter-button'); if (b) apply(b.dataset.filter); });
        search.addEventListener('input', function () { apply(active); });
        var hashFilter = (location.hash.match(/[?&]filter=([^&]+)/) || [])[1];
        apply(hashFilter || 'all');
      }

      function mountAnnouncement() {
        var cfg = window.CB_BANNER_CONFIG;
        var bar = document.getElementById('announcement-bar');
        if (!cfg || !cfg.enabled || !bar) return;
        bar.className = 'announcement-bar announcement-bar--visible announcement-bar--' + (cfg.type || 'info');
        var html = '<div class="announcement-inner">';
        if (cfg.icon) html += '<span class="announcement-icon">' + cfg.icon + '</span>';
        html += '<div class="announcement-copy">';
        if (cfg.title) html += '<strong>' + cfg.title + '</strong>';
        if (cfg.subtitle) html += '<span>' + cfg.subtitle + '</span>';
        html += '</div>';
        if (cfg.cta && cfg.cta.enabled) html += '<a class="announcement-cta" href="' + cfg.cta.url + '" target="' + (cfg.cta.target || '_blank') + '" rel="noopener">' + cfg.cta.label + '</a>';
        html += '</div>';
        bar.innerHTML = html;
      }

      mountAnnouncement();
      setTimeout(renderProducts, 500);
      window.addEventListener('hashchange', function () { setTimeout(renderProducts, 120); });
    });
  </script>
</body>
</html>
